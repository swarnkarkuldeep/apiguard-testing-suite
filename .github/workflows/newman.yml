name: API tests

# Runs the whole pipeline on every push and pull request:
# start MySQL + both APIs -> Newman (local, then staging) -> SQL checks -> upload HTML reports.
on:
  push:
  pull_request:

jobs:
  newman:
    runs-on: ubuntu-latest
    env:
      # Used by docker-compose.yml, scripts/run-newman.js and scripts/db-verify.js.
      # Dev-only values; add repository secrets with the same names to override the JWT ones.
      MYSQL_ROOT_PASSWORD: ci-root-password
      JWT_SECRET_LOCAL: ${{ secrets.JWT_SECRET_LOCAL || 'ci-local-secret' }}
      JWT_SECRET_STAGING: ${{ secrets.JWT_SECRET_STAGING || 'ci-staging-secret' }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_USER: root
      DB_PASSWORD: ci-root-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Newman and dependencies
        run: npm ci

      - name: Start MySQL and both APIs
        run: docker compose up -d --build --wait

      - name: Wait for the APIs to answer
        run: |
          for port in 3000 3001; do
            for i in $(seq 1 30); do
              curl -fs "http://localhost:$port/health" && break
              sleep 2
            done
            curl -fs "http://localhost:$port/health" > /dev/null
          done

      - name: Run tests (local + staging) and SQL checks
        run: npm run test:all

      - name: Upload HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/*.html

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down -v
